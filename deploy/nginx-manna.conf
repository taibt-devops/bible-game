# nginx trên EC2: nhận HTTPS từ CloudFront và chuyển /api/ về Node ở 127.0.0.1:8787.
# setup-ec2.sh thay api-origin.example.com bằng tên miền thật.
server {
    listen 80;
    listen [::]:80;
    server_name api-origin.example.com;
    # Chỉ dùng cho Let's Encrypt (gia hạn chứng chỉ); còn lại chuyển sang HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-origin.example.com;

    ssl_certificate     /etc/letsencrypt/live/api-origin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-origin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Dành sẵn cho phòng học WebSocket (giai đoạn 3).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
