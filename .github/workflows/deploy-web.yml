name: Triển khai trang web
# Chạy tay (Actions → Triển khai trang web → Run workflow). Cài đặt: docs/DEPLOY.md mục 8.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./deploy/deploy-web.sh "${{ vars.WEB_BUCKET }}" "${{ vars.CF_DISTRIBUTION_ID }}"
